aid: a-frame
name: A-Frame
description: 'A-Frame Brands is a Los Angeles-based consumer brand incubator and product-development
  company founded in 2019 by entrepreneur Ari Bloom and actor Hill Harper. It partners with celebrities
  and cultural figures to build purpose-driven personal-care, beauty, fragrance, home-care, and pet-care
  brands, taking each from opportunity identification through product development, design, sourcing,
  production, and retail go-to-market. Brands in its portfolio include LOVED01 (John Legend), Kinlo
  (Naomi Osaka), Proudly (Gabrielle Union and Dwyane Wade), and Purrfect Paws, sold through retailers
  such as Target, Walmart, Amazon, CVS, JCPenney, QVC, and Bath & Body Works. Backed by Initialized
  Capital. This is a consumer company profile in the API Evangelist network; A-Frame publishes no public
  API or developer program.'
